  <body class="font-sans antialiased">
    <script>
      // Apply theme before first paint to avoid a flash. Uses the saved
      // choice, else the device's prefers-color-scheme.
      (function () {
        try {
          var t = localStorage.getItem('ntybl_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
